<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mecmûa · Wheel preview</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 38%,#1c2857,#0b102b 62%,#060919);color:#eee5d2;font-family:Georgia,serif}header{height:72px;display:flex;justify-content:center;align-items:center;border-bottom:1px solid #caa65c33;letter-spacing:.3em;color:#d6b776}header a{color:inherit;text-decoration:none}main{max-width:920px;margin:auto;padding:24px 20px 36px;text-align:center}.eyebrow{font:10px monospace;letter-spacing:.24em;color:#ada58e;text-transform:uppercase;margin:0 0 14px}.instrument{position:relative;max-width:700px;width:min(78vh,100%);margin:auto;user-select:none;touch-action:none;filter:drop-shadow(0 24px 25px #0009)}.layer{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}.world,.hub{position:absolute;inset:0}.world{clip-path:circle(36.65% at 49.8% 47.85%);transform-origin:49.8% 47.85%;will-change:transform;cursor:grab;pointer-events:auto}.world:active{cursor:grabbing}.world img,.hub img{width:100%;display:block}.hub{clip-path:circle(11.8% at 49.8% 47.85%);pointer-events:none}.centre-button{position:absolute;left:38%;top:36%;width:23.6%;height:23.6%;border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:5}.centre-button:focus-visible{outline:2px solid #fff;outline-offset:6px}.clicker{position:absolute;top:8.3%;left:calc(49.8% - 13px);width:26px;height:59px;z-index:6;transform-origin:50% 10px;pointer-events:none;filter:drop-shadow(2px 4px 3px #000a)}.clicker::before{content:'';position:absolute;left:3px;top:0;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff2b2,#c59432 48%,#62431b 80%);border:1px solid #e9c973}.clicker::after{content:'';position:absolute;left:6px;top:14px;width:14px;height:44px;clip-path:polygon(0 0,100% 0,56% 100%,40% 100%);background:linear-gradient(90deg,#684615,#f6d880 45%,#ab772a 80%);border-radius:2px}.clicker.hit{animation:flick .09s ease-out}@keyframes flick{0%{transform:rotate(-15deg)}70%{transform:rotate(5deg)}100%{transform:rotate(0)}}.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:6px 0 12px}button{font:11px monospace;text-transform:uppercase;letter-spacing:.16em;color:#e9d5a2;background:#171e3d;border:1px solid #b9954d77;border-radius:30px;padding:13px 24px;cursor:pointer}button:hover{border-color:#e9d5a2}button:focus-visible{outline:2px solid #fff;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}.hint{font:12px/1.6 monospace;color:#aaa9b7;margin:0}#state{min-height:20px;font:11px monospace;letter-spacing:.12em;color:#d8bd85}.note{font:10px/1.6 monospace;color:#7e8196;margin-top:24px}@media(max-width:600px){main{padding:28px 8px}.instrument{width:100%}.clicker{width:20px;height:42px;left:calc(49.8% - 10px)}.clicker::after{height:29px;top:12px;left:5px;width:11px}.clicker::before{width:17px;height:17px}.controls{margin-top:10px}header{height:58px}}

/* Stiff leather flapper, fixed at its brass rivet. */
.clicker { top:7.6%; left:48.05%; width:3.5%; height:10%; transform-origin:50% 11%; filter:drop-shadow(2px 3px 2px #000a); }
.clicker::before,.clicker::after { display:none; }
.clicker img { width:100%;height:100%;object-fit:fill;display:block; }
@media(max-width:600px){.clicker{top:7.6%;left:48.05%;width:3.5%;height:10%}}
@media(prefers-reduced-motion:reduce){.clicker.hit{animation:none}}
</style></head><body><header><a href="/">MECMÛA</a></header><main><p class="eyebrow">The Wheel · working preview</p><div class="instrument" id="instrument"><img class="layer" src="wheel.png" alt="Carved wooden wheel with a lapis and green gemstone world and gold centre"><div class="world" id="world"><img src="wheel.png" alt="" draggable="false"></div><div class="hub"><img src="wheel.png" alt=""></div><button class="centre-button" id="centre" aria-label="Spin the wheel"></button><div class="clicker" id="clicker" aria-hidden="true"><img src="leather-clicker.png" alt=""></div></div><div class="controls"><button id="spin">Spin the wheel</button><button id="mute" aria-pressed="false">Sound on</button></div><p class="hint">Tap the gold centre, or drag the world and release.</p><p id="state" role="status" aria-live="polite">Ready</p><p class="note">Design preview · your recorded wheel sound · no readings assigned yet</p></main><script>
(()=>{'use strict';const world=document.getElementById('world'),instrument=document.getElementById('instrument'),clicker=document.getElementById('clicker'),spin=document.getElementById('spin'),centre=document.getElementById('centre'),mute=document.getElementById('mute'),state=document.getElementById('state');let angle=0,running=false,frame=0,muted=false,context,buffer,drag=null,lastTick=-1,lastVoice=0,spinBuffer,source,spinGain,loading;const step=15,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clicks=[.05,.13,.21,.299,.394,.474,.564,.644,.723,.813,.903,.988,1.073,1.157,1.232,1.322,1.447,1.596,1.766,1.931,2.125,2.33];
const fastClicks=clicks.filter(t=>t<1.2),timeline=[...fastClicks,...fastClicks.map(t=>t+1.2),...fastClicks.map(t=>t+2.4),...clicks.filter(t=>t>=1.2).map(t=>t+2.4)];
async function audio(){try{context ||= new(window.AudioContext||window.webkitAudioContext)();if(context.state==='suspended')await context.resume();if(!loading)loading=fetch('wheel-click.mp3').then(r=>{if(!r.ok)throw Error('Audio unavailable');return r.arrayBuffer();}).then(b=>context.decodeAudioData(b)).then(raw=>{buffer=raw;const sr=raw.sampleRate,first=Math.round(sr*1.2),tail=raw.length-first;spinBuffer=context.createBuffer(raw.numberOfChannels,first*3+tail,sr);for(let c=0;c<raw.numberOfChannels;c++){const x=raw.getChannelData(c),y=spinBuffer.getChannelData(c);for(let i=0;i<3;i++)y.set(x.subarray(0,first),i*first);y.set(x.subarray(first),first*3);}});await loading;return true;}catch(e){loading=null;state.textContent='Sound could not load. Try again.';return false;}}
function updateMute(){mute.textContent=muted?'Sound off':'Sound on';mute.setAttribute('aria-pressed',String(muted));if(spinGain)spinGain.gain.value=muted?0:.7;}
function tick(recordedSpin=false){clicker.classList.remove('hit');void clicker.offsetWidth;clicker.classList.add('hit');if(recordedSpin||muted||!context||!buffer||context.state!=='running')return;const now=context.currentTime;if(now-lastVoice<.025)return;lastVoice=now;const click=context.createBufferSource(),gain=context.createGain();click.buffer=buffer;gain.gain.value=.65;click.connect(gain);gain.connect(context.destination);click.start(0,.042,.045);}
function render(a,recordedSpin=false){const before=Math.floor(angle/step),after=Math.floor(a/step);angle=a;world.style.transform=`rotate(${angle}deg)`;if(before!==after&&!recordedSpin)tick();}
function finish(a){if(source){try{source.stop();}catch(e){}source=null;}render(a,true);running=false;spin.disabled=centre.disabled=false;state.textContent='At rest';}
async function launch(turns=5,duration=6800,direction=1){if(running)return;running=true;spin.disabled=centre.disabled=true;state.textContent='Preparing…';const ready=await audio();if(!ready){running=false;spin.disabled=centre.disabled=false;return;}const start=angle,target=start+direction*step*(timeline.length+.5);if(reduced){finish(target);return;}state.textContent='Turning…';source=context.createBufferSource();spinGain=context.createGain();source.buffer=spinBuffer;spinGain.gain.value=muted?0:.7;source.connect(spinGain);spinGain.connect(context.destination);const t0=context.currentTime+.035;source.start(t0);const endTime=spinBuffer.duration;let current=0;const times=[0,...timeline,endTime];function advance(){const elapsed=Math.max(0,context.currentTime-t0);while(current<timeline.length&&elapsed>=timeline[current]){tick(true);current++;}const k=Math.min(current,timeline.length);const lo=times[k],hi=times[k+1],p=Math.min(1,Math.max(0,(elapsed-lo)/Math.max(.001,hi-lo)));const units=k+p*(k===timeline.length?.5:1);render(start+direction*step*units,true);if(elapsed<endTime)frame=requestAnimationFrame(advance);else finish(target);}frame=requestAnimationFrame(advance);}
function pointerAngle(e){const r=instrument.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height*.4785),e.clientX-(r.left+r.width*.498))*180/Math.PI;}
world.addEventListener('pointerdown',e=>{if(running||e.button!==0)return;audio();world.setPointerCapture(e.pointerId);drag={pointer:e.pointerId,last:pointerAngle(e),start:angle,time:performance.now(),speed:0,previousTime:performance.now()};state.textContent='Turning…';});world.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;const a=pointerAngle(e),d=((a-drag.last+540)%360)-180,now=performance.now(),dt=Math.max(1,now-drag.previousTime);drag.speed=.6*drag.speed+.4*d/dt;render(angle+d);drag.last=a;drag.previousTime=now;});function release(e){if(!drag||e.pointerId!==drag.pointer)return;const speed=performance.now()-drag.previousTime<130?drag.speed:0,moved=Math.abs(angle-drag.start);drag=null;if(moved<4){launch();return;}if(Math.abs(speed)>.04)launch(Math.min(5,Math.max(.2,Math.abs(speed)*2)),Math.min(6500,1800+Math.abs(speed)*3000),Math.sign(speed));else finish(Math.round(angle/step)*step+step/2);}world.addEventListener('pointerup',release);world.addEventListener('pointercancel',e=>{if(drag){drag=null;finish(angle);}});spin.addEventListener('click',()=>launch());centre.addEventListener('click',()=>launch());mute.addEventListener('click',()=>{muted=!muted;if(!muted)audio();updateMute();});window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);if(source){try{source.stop();}catch(e){}}if(context)context.suspend();});})();
</script></body></html>
