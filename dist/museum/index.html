<html lang="en">
<head>

<link rel="stylesheet" href="../shared/midnight.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--parchment-50); color: var(--text-primary); font-family: var(--font-text);
    background-image: var(--grain); background-repeat: repeat;
  }

  /* ===== header ===== */
  header { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(8px);
    background: linear-gradient(180deg, rgba(244,238,222,0.94), rgba(244,238,222,0.72)); border-bottom: var(--hairline); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 18px 30px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .wm { font-family: var(--font-display); text-transform: lowercase; letter-spacing: 0.04em; font-size: 30px; line-height: 1;
    background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav a { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; color: var(--ink-700);
    padding: 8px 13px; border-radius: 999px; transition: all var(--dur-fast) var(--ease-quiet); white-space: nowrap; text-decoration: none; }
  .nav a:hover { background: rgba(196,154,75,0.14); color: var(--ink-900); }
  .nav a.here { background: var(--ink-900); color: var(--parchment-50); }
  .crumb { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.22em; font-size: 11px; color: var(--text-muted); }
  .count { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--gold-700); }
  .spacer { flex: 1; }

  /* toolbar */
  .toolbar { max-width: 1400px; margin: 0 auto; padding: 0 30px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .search { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
  .search input { width: 100%; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; padding: 10px 14px 10px 34px;
    border: var(--hairline); border-radius: 999px; background: var(--surface-card); color: var(--ink-900); outline: none; }
  .search input::placeholder { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.16em; font-size: 10px; }
  .search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 13px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid var(--border-soft); background: transparent; color: var(--ink-700); cursor: pointer; transition: all var(--dur-fast) var(--ease-quiet); }
  .chip:hover { border-color: var(--ink-900); }
  .chip.on { background: var(--ink-900); color: var(--parchment-50); border-color: var(--ink-900); }
  .seg { display: inline-flex; border: var(--hairline); border-radius: 999px; overflow: hidden; }
  .seg button { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; padding: 8px 14px; background: transparent; border: none; cursor: pointer; color: var(--ink-700); }
  .seg button.on { background: var(--merlot); color: #f2e9dd; }
  select.sort { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px; padding: 8px 12px; border: var(--hairline); border-radius: 999px; background: var(--surface-card); color: var(--ink-700); cursor: pointer; }

  main { max-width: 1400px; margin: 0 auto; padding: 26px 30px 140px; }

  /* ===== GRID VIEW ===== */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 22px; }
  .card { position: relative; cursor: pointer; }
  .card .thumb { position: relative; border-radius: var(--radius-md); overflow: hidden; border: var(--hairline); background: var(--night-800); aspect-ratio: 4/5; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--dur-slow) var(--ease-quiet); }
  .card:hover .thumb img { transform: scale(1.05); }
  .card .id { position: absolute; top: 10px; left: 10px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
    background: rgba(10,10,38,0.62); color: var(--gold-200); padding: 4px 8px; border-radius: 6px; }
  .card .pick { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,0.8);
    background: rgba(10,10,38,0.35); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; opacity: 0; transition: opacity var(--dur-fast); }
  .card:hover .pick, .card.sel .pick { opacity: 1; }
  .card.sel .pick { background: var(--gold-500); border-color: var(--gold-500); color: var(--night-900); }
  .card.sel .thumb { outline: 3px solid var(--gold-500); outline-offset: 2px; }
  .card .cap { padding: 10px 2px 0; }
  .card .ttl { font-family: var(--font-serif); font-size: 17px; line-height: 1.16; letter-spacing: -0.01em; }
  .card .tags { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-top: 5px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .pal { display: inline-flex; gap: 3px; margin-left: auto; }
  .pal i { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.12); }

  /* ===== TABLE VIEW ===== */
  table { width: 100%; border-collapse: collapse; }
  thead th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
    text-align: left; padding: 10px 14px; border-bottom: var(--hairline); position: sticky; top: 132px; background: var(--parchment-50); }
  tbody tr { border-bottom: 1px solid var(--border-soft); cursor: pointer; transition: background var(--dur-fast); }
  tbody tr:hover { background: rgba(196,154,75,0.08); }
  tbody tr.sel { background: rgba(196,154,75,0.16); }
  td { padding: 10px 14px; vertical-align: middle; }
  td.tn img { width: 54px; height: 42px; object-fit: cover; border-radius: 6px; border: var(--hairline); display: block; }
  td.idc { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--gold-700); white-space: nowrap; }
  td.ttlc { font-family: var(--font-serif); font-size: 18px; }
  td.metac { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); }
  td.dim { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text-muted); white-space: nowrap; }

  .empty { text-align: center; padding: 80px 0; font-family: var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; font-size: 12px; color: var(--text-faint); }

  /* ===== detail drawer ===== */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 94vw); z-index: 70; background: var(--surface-card);
    border-left: var(--hairline); box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform var(--dur-base) var(--ease-quiet); overflow: auto; }
  .drawer.on { transform: translateX(0); }
  .drawer .dimg { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .drawer .dbody { padding: 26px 30px 40px; }
  .drawer .x { position: absolute; top: 16px; right: 18px; background: rgba(10,10,38,0.5); color: #fff; border: none; width: 34px; height: 34px; border-radius: 999px; cursor: pointer; font-size: 16px; }
  .drawer .did { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-700); }
  .drawer h2 { font-family: var(--font-serif); font-weight: 500; font-size: 34px; line-height: 1.08; letter-spacing: -0.015em; margin: 8px 0 18px; }
  .drawer .meta-grid { display: grid; grid-template-columns: 100px 1fr; gap: 10px 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; }
  .drawer .meta-grid .k { color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.16em; font-size: 9.5px; padding-top: 2px; }
  .drawer .meta-grid .v { color: var(--text-primary); }
  .drawer .palrow { display: flex; gap: 8px; margin-top: 4px; }
  .drawer .palrow i { width: 30px; height: 30px; border-radius: 7px; border: var(--hairline); position: relative; }
  .tagpills { display: flex; gap: 7px; flex-wrap: wrap; }
  .tagpills span { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--border-soft); color: var(--ink-700); }
  .dactions { display: flex; gap: 10px; margin-top: 26px; }
  .btn { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px; padding: 12px 20px; border-radius: 999px; cursor: pointer; border: 1px solid transparent; }
  .btn.gold { background: var(--grad-gold); color: var(--night-900); }
  .btn.ghost { background: transparent; border-color: var(--ink-900); color: var(--ink-900); }

  /* ===== compose bar ===== */
  .compose { position: fixed; left: 50%; transform: translateX(-50%) translateY(140%); bottom: 26px; z-index: 65;
    background: var(--night-800); color: var(--text-on-night); border: var(--hairline-night); border-radius: 999px; box-shadow: var(--shadow-night);
    padding: 12px 14px 12px 24px; display: flex; align-items: center; gap: 18px; transition: transform var(--dur-base) var(--ease-quiet); }
  .compose.on { transform: translateX(-50%) translateY(0); }
  .compose .n { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  .compose .thumbs { display: flex; }
  .compose .thumbs img { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; border: 2px solid var(--night-800); margin-left: -8px; }
  .compose .clear { background: none; border: none; color: var(--text-on-night-muted); cursor: pointer; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
  .compose .go { background: var(--grad-gold); color: var(--night-900); border: none; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mecmua-theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>

      { f:'nature-scenery/desert-palms-red-wall.jpg', t:'Palms, Red Wall', themes:['Travel','Nature'], motifs:['Palm','Architecture'], pal:['#c02a23','#2f6b4f','#e3a637'] },
      { f:'nature-scenery/desert-rocky-coast.jpg', t:'Rocky Coast', themes:['Landscape','Water'], motifs:['Sea','Rock'], pal:['#1c5f63','#a3958a','#9fc2cf'] },
      { f:'nature-scenery/figure-in-tropical-foliage.jpg', t:'Figure in Foliage', themes:['Figure','Nature'], motifs:['Jungle','Figure'], pal:['#2f4a3a','#5b7a4a','#c9a063'] },
      { f:'nature-scenery/figure-red-rock-landscape.jpg', t:'Figure, Red Rock', themes:['Figure','Landscape'], motifs:['Desert','Figure'], pal:['#c25a3a','#e0612f','#7b3a2e'] },
      { f:'nature-scenery/garden-stone-archway.jpg', t:'Stone Archway', themes:['Landscape','Travel'], motifs:['Garden','Arch'], pal:['#a3958a','#5b7a4a','#e6ddcb'] },
      { f:'nature-scenery/green-forest-light.jpg', t:'Forest Light', themes:['Nature'], motifs:['Forest','Light'], pal:['#2f6b4f','#5b7a4a','#b0a86a'] },
      { f:'nature-scenery/green-misty-mountains.jpg', t:'Misty Mountains', themes:['Landscape','Nature'], motifs:['Mountain','Mist'], pal:['#2f4a3a','#9aa7a0','#3a4a4a'] },
      { f:'nature-scenery/green-misty-river.jpg', t:'Misty River', themes:['Water','Nature'], motifs:['River','Mist'], pal:['#2f6b4f','#9aa7a0','#bcd6cf'] },
      { f:'nature-scenery/leaf-waterdrops.jpg', t:'Leaf & Waterdrops', themes:['Nature'], motifs:['Botanical','Water'], pal:['#2f6b4f','#5b7a4a','#9fc2cf'] },
      { f:'nature-scenery/leopard-spotted-orchid.jpg', t:'Spotted Orchid', themes:['Nature'], motifs:['Botanical','Flower'], pal:['#c0186f','#e89bbf','#c9a063'] },
      { f:'nature-scenery/lone-tree-on-hill.jpg', t:'Lone Tree', themes:['Landscape'], motifs:['Tree','Hill'], pal:['#5b7a4a','#b0a86a','#e6ddcb'] },
      { f:'nature-scenery/minimal-sea-sun.jpg', t:'Sea & Sun, Minimal', themes:['Water','Cosmos'], motifs:['Sea','Sun'], pal:['#e3a637','#1b4f8c','#e6ddcb'] },
      { f:'nature-scenery/moody-night-sea.jpg', t:'Moody Night Sea', themes:['Water','Cosmos'], motifs:['Sea','Night'], pal:['#14204e','#1b3fc4','#0a1030'] },
      { f:'nature-scenery/moon-over-dark-sea.jpg', t:'Moon over Dark Sea', themes:['Cosmos','Water'], motifs:['Moon','Sea'], pal:['#1a2150','#e3a637','#0a0e2c'] },
      { f:'nature-scenery/orange-sky-over-sea.jpg', t:'Orange Sky, Sea', themes:['Cosmos','Water'], motifs:['Sky','Sea'], pal:['#e0612f','#e3a637','#1b4f8c'] },
      { f:'nature-scenery/orange-storm-cloud-house.jpg', t:'Storm over the House', themes:['Landscape','Cosmos'], motifs:['Storm','Sky'], pal:['#e0612f','#7b3a2e','#2a3358'] },
      { f:'nature-scenery/palms-starry-sky.jpg', t:'Palms & Stars', themes:['Cosmos','Travel'], motifs:['Palm','Stars'], pal:['#14204e','#2f6b4f','#e3a637'] },
      { f:'nature-scenery/pines-by-sea-cove.jpg', t:'Pines by the Cove', themes:['Landscape','Water'], motifs:['Tree','Sea'], pal:['#2f4a3a','#1c5f63','#9fc2cf'] },
      { f:'nature-scenery/purple-lit-forest.jpg', t:'Violet Forest', themes:['Nature','Wonder'], motifs:['Forest','Light'], pal:['#5b4a9c','#45245e','#2f4a3a'] },
      { f:'nature-scenery/red-butterfly-pink.jpg', t:'Red Butterfly', themes:['Nature'], motifs:['Butterfly'], pal:['#c02a23','#e89bbf','#c25a3a'] },
      { f:'nature-scenery/sea-and-clouds-sailboat.jpg', t:'Sailboat & Clouds', themes:['Water','Landscape'], motifs:['Sea','Sail'], pal:['#1b4f8c','#9fc2cf','#e6ddcb'] },
      { f:'nature-scenery/tree-lined-path.jpg', t:'Tree-Lined Path', themes:['Landscape','Nature'], motifs:['Path','Tree'], pal:['#5b7a4a','#2f6b4f','#b0a86a'] },
      { f:'nature-scenery/tropical-garden-palms.jpg', t:'Tropical Palms', themes:['Nature','Travel'], motifs:['Palm','Jungle'], pal:['#2f6b4f','#5b7a4a','#1c5f63'] },
      { f:'nature-scenery/white-flowers-garden.jpg', t:'White Flowers', themes:['Nature'], motifs:['Botanical','Flower'], pal:['#e6ddcb','#5b7a4a','#bcd6cf'] },
    ];
    A.forEach((e,i)=> e.id = 'DD-' + String(i+1).padStart(3,'0'));
    const dims = {}; // filled as images load

    const themes = [...new Set(A.flatMap(e=>e.themes))].sort();
    let view='grid', q='', theme=null, sort='id';
    const sel = new Set();

    const stage = document.getElementById('stage');
    const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

    function filtered(){
      let r = A.filter(e=>{
        if (theme && !e.themes.includes(theme)) return false;
        if (q){ const hay=(e.t+' '+e.themes.join(' ')+' '+e.motifs.join(' ')+' '+e.id).toLowerCase(); if(!hay.includes(q)) return false; }
        return true;
      });
      r.sort((a,b)=> sort==='title' ? a.t.localeCompare(b.t) : sort==='theme' ? a.themes[0].localeCompare(b.themes[0])||a.t.localeCompare(b.t) : a.id.localeCompare(b.id));
      return r;
    }

    function palDots(pal){ return `<span class="pal">${pal.map(c=>`<i style="background:${c}"></i>`).join('')}</span>`; }

    function render(){
      const r = filtered();
      document.getElementById('count').textContent = r.length + ' plate' + (r.length===1?'':'s') + (theme||q?' · filtered':'');
      stage.className = view;
      if (!r.length){ stage.className=''; stage.innerHTML = '<div class="empty">No plates match — try another theme.</div>'; return; }
      if (view==='grid'){
        stage.innerHTML = r.map(e=>`
          <div class="card ${sel.has(e.id)?'sel':''}" data-id="${e.id}">
            <div class="thumb">
              <img src="${DIR}${e.f}" alt="" data-id="${e.id}" />
              <span class="id">${e.id}</span>
              <button class="pick" data-pick="${e.id}">${sel.has(e.id)?'✓':'+'}</button>
            </div>
            <div class="cap">
              <div class="ttl">${esc(e.t)}</div>
              <div class="tags">${e.themes.concat(e.motifs).slice(0,3).join(' · ')} ${palDots(e.pal)}</div>
            </div>
          </div>`).join('');
      } else {
        stage.innerHTML = `<table><thead><tr>
            <th></th><th>Plate</th><th>Title</th><th>Theme</th><th>Motifs</th><th>Palette</th><th>Dimensions</th>
          </tr></thead><tbody>${r.map(e=>`
          <tr class="${sel.has(e.id)?'sel':''}" data-id="${e.id}">
            <td class="tn"><img src="${DIR}${e.f}" alt="" data-id="${e.id}" /></td>
            <td class="idc">${e.id}</td>
            <td class="ttlc">${esc(e.t)}</td>
            <td class="metac">${e.themes.join(', ')}</td>
            <td class="metac">${e.motifs.join(', ')}</td>
            <td>${palDots(e.pal)}</td>
            <td class="dim" data-dim="${e.id}">${dims[e.id]||'—'}</td>
          </tr>`).join('')}</tbody></table>`;
      }
      // wire
      stage.querySelectorAll('[data-id]').forEach(n=>{});
      stage.querySelectorAll('.card, tbody tr').forEach(n=>{
        n.addEventListener('click', ev=>{ if (ev.target.closest('[data-pick]')) return; openDetail(n.dataset.id); });
      });
      stage.querySelectorAll('[data-pick]').forEach(b=> b.addEventListener('click', ev=>{ ev.stopPropagation(); toggle(b.dataset.pick); }));
      stage.querySelectorAll('img[data-id]').forEach(img=>{
        if (img.complete && img.naturalWidth) recordDim(img);
        else img.addEventListener('load', ()=>recordDim(img));
      });
    }

    function recordDim(img){
      const id = img.dataset.id, e = A.find(x=>x.id===id);
      const w = img.naturalWidth, h = img.naturalHeight;
      const orient = w>h ? 'Landscape' : h>w ? 'Portrait' : 'Square';
      dims[id] = `${w}×${h} · ${orient}`;
      e._w=w; e._h=h; e._orient=orient;
      document.querySelectorAll(`[data-dim="${id}"]`).forEach(td=> td.textContent = dims[id]);
    }

    function toggle(id){
      if (sel.has(id)) sel.delete(id); else sel.add(id);
      render(); renderCompose();
    }
    function renderCompose(){
      const bar = document.getElementById('compose');
      bar.classList.toggle('on', sel.size>0);
      document.getElementById('composeN').textContent = sel.size + ' selected';
      document.getElementById('composeThumbs').innerHTML = [...sel].slice(0,6).map(id=>{ const e=A.find(x=>x.id===id); return `<img src="${DIR}${e.f}" alt=""/>`; }).join('');
    }

    function openDetail(id){
      const e = A.find(x=>x.id===id); if(!e) return;
      const d = document.getElementById('drawer');
      const dimText = dims[id] || 'measuring…';
      d.innerHTML = `
        <button class="x" id="dx">✕</button>
        <img class="dimg" src="${DIR}${e.f}" alt="" />
        <div class="dbody">
          <div class="did">${e.id}</div>
          <h2>${esc(e.t)}</h2>
          <div class="meta-grid">
            <div class="k">Theme</div><div class="v"><div class="tagpills">${e.themes.map(t=>`<span>${t}</span>`).join('')}</div></div>
            <div class="k">Motifs</div><div class="v"><div class="tagpills">${e.motifs.map(t=>`<span>${t}</span>`).join('')}</div></div>
            <div class="k">Palette</div><div class="v"><div class="palrow">${e.pal.map(c=>`<i style="background:${c}" title="${c}"></i>`).join('')}</div></div>
            <div class="k">Dimensions</div><div class="v" data-dim="${e.id}">${dimText}</div>
            <div class="k">File</div><div class="v" style="word-break:break-all">${e.f}</div>
          </div>
          <div class="dactions">
            <button class="btn gold" id="dadd">${sel.has(id)?'✓ In issue':'+ Add to issue'}</button>
            <button class="btn ghost">Open full</button>
          </div>
        </div>`;
      d.classList.add('on');
      d.querySelector('#dx').onclick = ()=> d.classList.remove('on');
      d.querySelector('#dadd').onclick = ()=>{ toggle(id); openDetail(id); };
      const img = d.querySelector('.dimg');
      if (!img.complete) { img.dataset.id = id; img.addEventListener('load', ()=>recordDim(img)); }
    }
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.getElementById('drawer').classList.remove('on'); });

    // controls
    document.getElementById('q').addEventListener('input', e=>{ q=e.target.value.trim().toLowerCase(); render(); });
    document.getElementById('sort').addEventListener('change', e=>{ sort=e.target.value; render(); });
    document.getElementById('viewseg').querySelectorAll('button').forEach(b=> b.onclick=()=>{ view=b.dataset.v; document.querySelectorAll('#viewseg button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
    document.getElementById('composeClear').onclick = ()=>{ sel.clear(); render(); renderCompose(); };
    document.getElementById('composeGo').onclick = ()=>{ const bar=document.getElementById('compose'); const go=document.getElementById('composeGo'); go.textContent='Issue composed ✦'; setTimeout(()=>go.textContent='Compose issue →',1400); };

    const tc = document.getElementById('themechips');
    tc.innerHTML = `<button class="chip on" data-t="">All</button>` + themes.map(t=>`<button class="chip" data-t="${t}">${t}</button>`).join('');
    tc.querySelectorAll('.chip').forEach(c=> c.onclick=()=>{ theme=c.dataset.t||null; tc.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); render(); });

    render();
  </script>
</body>
