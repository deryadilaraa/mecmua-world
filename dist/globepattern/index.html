<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mecmûa — Globe Pattern</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../shared/midnight.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; color: #f2e9dd; font-family: var(--font-text);
    background: radial-gradient(115% 80% at 50% 30%, #1c2658 0%, #121a42 40%, #0a0e2c 72%, #070a20 100%) no-repeat;
    background-attachment: fixed; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  /* ===== header ===== */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: 0 44px; height: 70px;
    display: flex; align-items: center; gap: 22px; }
  .wm-mini { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.3em; font-size: 17px;
    background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; padding-left: 0.3em; }
  .spacer { flex: 1; }
  .nav { display: flex; gap: 6px; }
  .nav a { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.2em; font-size: 10px;
    color: rgba(243,236,221,0.66); padding: 9px 14px; border-radius: 999px; transition: color var(--dur-fast) var(--ease-quiet); white-space: nowrap; }
  .nav a:hover, .nav a.here { color: #e6c785; }

  .page { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 124px 30px 90px; display: grid; justify-items: center; }

  h1 { font-family: var(--font-display), var(--font-serif); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 400;
    font-size: clamp(30px, 4.6vw, 50px); margin: 0; text-align: center; padding-left: 0.12em;
    background: linear-gradient(180deg, #e8d09a 0%, #d2a851 52%, #b98b3d 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .dek { font-family: var(--font-serif); font-style: italic; font-size: clamp(16px, 2vw, 20px); color: rgba(242,233,221,0.7); margin: 16px 0 0; text-align: center; max-width: 42ch; }

  /* ===== the spinning world globe (exact from The Wheel) ===== */
  .orbit { position: relative; width: min(520px, 86vw); aspect-ratio: 1; display: grid; place-items: center; margin-top: 54px; }

  .globe { position: absolute; z-index: 0; width: 92%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 36% 30%, #1a2a66 0%, #122048 45%, #0a1030 100%);
    box-shadow: inset -16px -22px 60px rgba(0,0,0,0.62), inset 16px 18px 48px rgba(120,150,255,0.15), 0 0 80px rgba(60,90,200,0.30); }
  .globe .sky { position: absolute; top: 0; left: 0; width: 200%; height: 100%; --spin: 36s;
    background-image: url(../assets/imagery/charts-reference/glowing-world-network-map.png);
    background-size: 50% 100%; background-repeat: repeat-x; }
  @media (prefers-reduced-motion: no-preference){
    .globe .sky { animation: turn var(--spin) linear infinite; }
  }
  @keyframes turn { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .globe .shade { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; z-index: 1;
    background: radial-gradient(circle at 35% 30%, rgba(150,180,255,0.22) 0%, rgba(150,180,255,0) 42%),
                radial-gradient(circle at 68% 74%, rgba(6,8,28,0.6) 0%, rgba(6,8,28,0) 52%); }
  .globe .limb { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 2px 1px rgba(214,178,112,0.3), inset -8px -10px 40px rgba(6,8,28,0.66), inset 10px 12px 36px rgba(120,150,255,0.10); pointer-events: none; z-index: 2; }

  /* gold armillary rings */
  .armil { position: absolute; border: 1px solid rgba(214,178,112,0.42); border-radius: 50%; pointer-events: none; z-index: 1; }
  .armil.out { width: 95%; height: 95%; border-color: rgba(214,178,112,0.3); }
  .armil.eq  { width: 95%; height: 27%; border-color: rgba(214,178,112,0.5); }
  .armil.mer { width: 27%; height: 95%; border-color: rgba(214,178,112,0.28); }
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mecmua-theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<script defer src="../shared/dark-toggle.js"></script>
</head>
<body>
  <header>
    <a class="wm-mini" href="../index.html">mecmûa</a>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="../index.html">Home</a>
      <a href="../library/index.html">Library</a>
      <a href="../mind/index.html">Mind</a>
      <a href="../museum/index.html">Museum</a>
      <a href="../magazine/index.html">Magazine</a>
      <a href="../wheel/index.html">Wheel</a>
      <a href="../chart/index.html">Chart</a>
      <a class="here" href="./index.html">Globe</a>
      <a href="../boutique/index.html">Boutique</a>
    </nav>
  </header>

  <div class="page">
    <h1>Globe Pattern</h1>
    <p class="dek">The world, turning quietly — continents lit in blue, bound by gold meridians.</p>

    <div class="orbit">
      <div class="globe"><div class="sky"></div><div class="shade"></div><div class="limb"></div></div>
      <div class="armil out"></div>
      <div class="armil eq"></div>
      <div class="armil mer"></div>
    </div>
  </div>
</body>
</html>
