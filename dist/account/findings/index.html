<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mecmûa — Findings</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../shared/midnight.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body { color: #f3ecdd; font-family: var(--font-serif, 'Cormorant Garamond', serif); }
  a { color: #e6c785; }

  header { position: sticky; top: 0; z-index: 10; padding: 0 44px; height: 70px; display: flex; align-items: center; gap: 24px;
    background: rgba(16,19,74,0.72); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(214,178,112,0.32); }
  .wm { font-family: var(--font-mono, 'DM Mono', monospace); text-transform: uppercase; letter-spacing: 0.3em; font-size: 14px;
    background: var(--grad-gold, linear-gradient(180deg,#e8d09a,#d2a851 60%,#b98b3d));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .crumb { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(243,236,221,0.5); }

  .wrap { max-width: 960px; margin: 0 auto; padding: 56px 44px 100px; }
  h1 { font-weight: 500; font-size: 38px; margin: 0 0 6px; }
  .sub { font-style: italic; color: rgba(243,236,221,0.65); margin: 0 0 44px; }

  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(214,178,112,0.28); border-radius: 14px; padding: 32px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } header, .wrap { padding-left: 20px; padding-right: 20px; } }
  .field { margin-bottom: 18px; }
  label { display: block; font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(243,236,221,0.5); margin-bottom: 7px; }
  input, textarea, select { width: 100%; font-family: var(--font-serif, 'Cormorant Garamond', serif); font-size: 16px;
    padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(214,178,112,0.3);
    background: rgba(255,255,255,0.03); color: #f4ecdd; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: rgba(214,178,112,0.7); }
  textarea { min-height: 100px; resize: vertical; font-style: italic; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(214,178,112,0.3); background: transparent;
    color: rgba(243,236,221,0.7); cursor: pointer; transition: all .15s; }
  .chip.on { background: rgba(214,178,112,0.18); color: #e6c785; border-color: rgba(214,178,112,0.6); }

  .btn { font-family: var(--font-mono, 'DM Mono', monospace); text-transform: uppercase; letter-spacing: 0.18em; font-size: 11px;
    padding: 14px 26px; border-radius: 999px; border: none;
    background: var(--grad-gold, linear-gradient(180deg,#e8d09a,#d2a851 60%,#b98b3d)); color: #2a1410; cursor: pointer; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .auto-note { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.08em;
    color: rgba(243,236,221,0.4); margin-top: 10px; line-height: 1.7; }
  .msg { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px; letter-spacing: 0.08em; margin-top: 14px; min-height: 14px; }
  .msg.bad { color: #e2849b; }
  .msg.good { color: #7fd39a; }

  .list { margin-top: 56px; }
  .list h2 { font-weight: 500; font-size: 22px; border-bottom: 1px solid rgba(214,178,112,0.24); padding-bottom: 14px; }
  .entry { display: grid; grid-template-columns: 120px 1fr auto; gap: 18px; align-items: center;
    padding: 16px 0; border-bottom: 1px solid rgba(214,178,112,0.14); }
  @media (max-width: 640px) { .entry { grid-template-columns: 1fr; gap: 6px; } }
  .entry .cat { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #d7b265; }
  .entry h3 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .entry p { font-size: 14px; color: rgba(243,236,221,0.6); margin: 0; font-family: system-ui, sans-serif; }
  .status { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .status.draft { background: rgba(255,255,255,0.06); color: rgba(243,236,221,0.5); }
  .status.published { background: rgba(90,180,120,0.16); color: #7fd39a; }
  .empty { font-style: italic; color: rgba(243,236,221,0.5); padding: 40px 0; }
</style>
</head>
<body>
  <header>
    <a class="wm" href="../../index.html">mecmûa</a>
    <span class="crumb">/ account / findings</span>
  </header>

  <div class="wrap">
    <h1>Findings</h1>
    <p class="sub">Saving research findings is not available in this public preview.</p>
    <p><a href="../../library/index.html">Browse the Library →</a></p>
  </div>
</body>
</html>
