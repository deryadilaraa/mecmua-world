<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mecmûa — Findings</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../shared/midnight.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body { color: #f3ecdd; font-family: var(--font-serif, 'Cormorant Garamond', serif); }
  a { color: #e6c785; }

  header { position: sticky; top: 0; z-index: 10; padding: 0 44px; height: 70px; display: flex; align-items: center; gap: 24px;
    background: rgba(16,19,74,0.72); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(214,178,112,0.32); }
  .wm { font-family: var(--font-mono, 'DM Mono', monospace); text-transform: uppercase; letter-spacing: 0.3em; font-size: 14px;
    background: var(--grad-gold, linear-gradient(180deg,#e8d09a,#d2a851 60%,#b98b3d));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .crumb { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(243,236,221,0.5); }

  .wrap { max-width: 960px; margin: 0 auto; padding: 56px 44px 100px; }
  h1 { font-weight: 500; font-size: 38px; margin: 0 0 6px; }
  .sub { font-style: italic; color: rgba(243,236,221,0.65); margin: 0 0 44px; }

  .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(214,178,112,0.28); border-radius: 14px; padding: 32px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } header, .wrap { padding-left: 20px; padding-right: 20px; } }
  .field { margin-bottom: 18px; }
  label { display: block; font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(243,236,221,0.5); margin-bottom: 7px; }
  input, textarea, select { width: 100%; font-family: var(--font-serif, 'Cormorant Garamond', serif); font-size: 16px;
    padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(214,178,112,0.3);
    background: rgba(255,255,255,0.03); color: #f4ecdd; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: rgba(214,178,112,0.7); }
  textarea { min-height: 100px; resize: vertical; font-style: italic; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(214,178,112,0.3); background: transparent;
    color: rgba(243,236,221,0.7); cursor: pointer; transition: all .15s; }
  .chip.on { background: rgba(214,178,112,0.18); color: #e6c785; border-color: rgba(214,178,112,0.6); }

  .btn { font-family: var(--font-mono, 'DM Mono', monospace); text-transform: uppercase; letter-spacing: 0.18em; font-size: 11px;
    padding: 14px 26px; border-radius: 999px; border: none;
    background: var(--grad-gold, linear-gradient(180deg,#e8d09a,#d2a851 60%,#b98b3d)); color: #2a1410; cursor: pointer; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .auto-note { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.08em;
    color: rgba(243,236,221,0.4); margin-top: 10px; line-height: 1.7; }
  .msg { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 10px; letter-spacing: 0.08em; margin-top: 14px; min-height: 14px; }
  .msg.bad { color: #e2849b; }
  .msg.good { color: #7fd39a; }

  .list { margin-top: 56px; }
  .list h2 { font-weight: 500; font-size: 22px; border-bottom: 1px solid rgba(214,178,112,0.24); padding-bottom: 14px; }
  .entry { display: grid; grid-template-columns: 120px 1fr auto; gap: 18px; align-items: center;
    padding: 16px 0; border-bottom: 1px solid rgba(214,178,112,0.14); }
  @media (max-width: 640px) { .entry { grid-template-columns: 1fr; gap: 6px; } }
  .entry .cat { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #d7b265; }
  .entry h3 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .entry p { font-size: 14px; color: rgba(243,236,221,0.6); margin: 0; font-family: system-ui, sans-serif; }
  .status { font-family: var(--font-mono, 'DM Mono', monospace); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .status.draft { background: rgba(255,255,255,0.06); color: rgba(243,236,221,0.5); }
  .status.published { background: rgba(90,180,120,0.16); color: #7fd39a; }
  .empty { font-style: italic; color: rgba(243,236,221,0.5); padding: 40px 0; }
</style>
</head>
<body>
  <header>
    <a class="wm" href="../../mecmua/index.html">mecmûa</a>
    <span class="crumb">/ account / findings</span>
  </header>

  <div class="wrap">
    <h1>Catalogue a finding</h1>
    <p class="sub">Add what you’ve read, seen, or discovered — categorize it, and select ones ready to publish.</p>

    <div class="card">
      <div class="row">
        <div class="field">
          <label for="f-title">Title</label>
          <input id="f-title" placeholder="e.g. The wound is the place where the Light enters" />
        </div>
        <div class="field">
          <label>Category</label>
          <div class="chips" id="f-chips"></div>
        </div>
      </div>

      <div class="field">
        <label for="f-notes">Notes / findings</label>
        <textarea id="f-notes" placeholder="Paste raw notes or write freely — structure comes later"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="f-source">Source / link</label>
          <input id="f-source" type="url" placeholder="https://…" />
        </div>
        <div class="field">
          <label for="f-trad">Tradition</label>
          <select id="f-trad"></select>
        </div>
      </div>

      <button class="btn" id="f-save">Save finding →</button>
      <div class="auto-note" id="f-auto"></div>
      <div class="msg" id="f-msg"></div>
    </div>

    <div class="list">
      <h2>Your findings</h2>
      <div id="f-list"><p class="empty">Loading…</p></div>
    </div>
  </div>

<script>
  // Categories, their labels, and where each one goes on save. Kept in step
  // with AUTO_PUBLISH in src/index.js — the server decides, this only explains.
  const CATEGORIES = [
    { id:'book',   label:'Books/authors',          auto:false },
    { id:'symbol', label:'Symbols & iconography',  auto:true,  to:'Library' },
    { id:'figure', label:'Historical figures',     auto:false },
    { id:'art',    label:'Art/imagery',            auto:true,  to:'Museum'  },
    { id:'ritual', label:'Rituals & practices',    auto:false },
    { id:'quote',  label:'Quotes/passages',        auto:false },
  ];
  const TRADITIONS = ['Stoic','Sufi','Both','Visual','Other'];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  let category = CATEGORIES[0].id;

  function paintChips() {
    $('f-chips').innerHTML = CATEGORIES.map((c) =>
      `<button type="button" class="chip${c.id === category ? ' on' : ''}" data-id="${c.id}">${esc(c.label)}</button>`
    ).join('');
    $('f-chips').querySelectorAll('.chip').forEach((el) => {
      el.onclick = () => { category = el.dataset.id; paintChips(); };
    });
  }

  function message(text, kind) {
    const el = $('f-msg');
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function entryRow(e) {
    const cat = CATEGORIES.find((c) => c.id === e.category);
    const label = cat ? cat.label.split('/')[0].split(' &')[0] : e.category;
    const badge = e.status === 'published'
      ? `Published${cat && cat.to ? ' → ' + cat.to : ''}`
      : 'Draft';
    const excerpt = (e.notes || '').slice(0, 160) + ((e.notes || '').length > 160 ? '…' : '');
    return `<div class="entry">
      <span class="cat">${esc(label)}</span>
      <div>
        <h3>${esc(e.title)}</h3>
        ${excerpt ? `<p>${esc(excerpt)}</p>` : ''}
      </div>
      <span class="status ${e.status}">${esc(badge)}</span>
    </div>`;
  }

  function paintList(entries) {
    $('f-list').innerHTML = entries.length
      ? entries.map(entryRow).join('')
      : '<p class="empty">Nothing catalogued yet.</p>';
  }

  async function load() {
    try {
      const res = await fetch('/api/findings');
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      paintList(await res.json());
    } catch (err) {
      $('f-list').innerHTML = `<p class="empty">Could not load findings — ${esc(err.message)}</p>`;
    }
  }

  async function save() {
    const title = $('f-title').value.trim();
    if (!title) { message('A title is required.', 'bad'); $('f-title').focus(); return; }

    const btn = $('f-save');
    btn.disabled = true;
    message('Saving…');

    try {
      const res = await fetch('/api/findings', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          title,
          category,
          notes: $('f-notes').value,
          source_url: $('f-source').value,
          tradition: $('f-trad').value,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || res.statusText);

      $('f-title').value = '';
      $('f-notes').value = '';
      $('f-source').value = '';
      message(body.status === 'published' ? 'Saved and published.' : 'Saved as a draft.', 'good');
      // Re-read rather than prepending, so the list always matches the database.
      await load();
    } catch (err) {
      message(err.message, 'bad');
    } finally {
      btn.disabled = false;
    }
  }

  $('f-trad').innerHTML = TRADITIONS.map((t) => `<option>${t}</option>`).join('');
  $('f-auto').textContent =
    CATEGORIES.filter((c) => c.auto).map((c) => c.label + ' → ' + c.to).join(' · ') +
    ' publish automatically on save. Everything else stays a draft until reviewed.';
  $('f-save').onclick = save;
  paintChips();
  load();
</script>
</body>
</html>
