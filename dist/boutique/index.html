<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mecmûa — The Boutique</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../shared/midnight.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { color: #f2e9dd; font-family: var(--font-text);
    background: radial-gradient(120% 80% at 50% 0%, #1c2658 0%, #121a42 42%, #0a0e2c 74%, #070a20 100%) no-repeat; background-attachment: fixed; }
  a { color: inherit; text-decoration: none; }

  /* header */
  header { position: sticky; top: 0; z-index: 50; padding: 0 40px; height: 70px; display: flex; align-items: center; gap: 22px; }
  .wm { font-family: var(--font-display); text-transform: lowercase; letter-spacing: 0.04em; font-size: 28px; line-height: 1;
    background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .crumb { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.22em; font-size: 11px; color: rgba(243,236,221,0.5); }
  .spacer { flex: 1; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .nav a { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; color: rgba(243,236,221,0.66);
    padding: 8px 13px; border-radius: 999px; transition: color var(--dur-fast) var(--ease-quiet); white-space: nowrap; }
  .nav a:hover, .nav a.here { color: #e6c785; }
  .bag { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(243,236,221,0.8); border: 1px solid rgba(214,178,112,0.35); border-radius: 999px; padding: 9px 16px; cursor: pointer; transition: all var(--dur-fast); }
  .bag:hover { border-color: var(--gold-line); color: #e6c785; }
  .bag .dot { background: var(--grad-gold); color: #2a1410; border-radius: 999px; min-width: 17px; height: 17px; display: grid; place-items: center; font-size: 9px; }

  /* hero */
  .hero { max-width: 1320px; margin: 0 auto; padding: 64px 40px 30px; text-align: center; }
  .hero .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: rgba(214,178,112,0.8);
    display: flex; align-items: center; justify-content: center; gap: 14px; }
  .hero .eyebrow .r { width: 40px; height: 1px; background: rgba(214,178,112,0.4); }
  .hero h1 { font-family: var(--font-display), var(--font-serif); text-transform: lowercase; font-weight: 400; letter-spacing: 0.01em;
    font-size: clamp(46px, 8vw, 96px); line-height: 0.96; margin: 20px 0 0;
    background: linear-gradient(180deg, #e8d09a 0%, #d2a851 52%, #b98b3d 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { font-family: var(--font-serif); font-style: italic; font-size: clamp(16px, 2vw, 21px); color: rgba(242,233,221,0.72); margin: 18px auto 0; max-width: 50ch; }

  /* filter row */
  .filters { max-width: 1320px; margin: 36px auto 0; padding: 0 40px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    border-bottom: 1px solid rgba(214,178,112,0.2); padding-bottom: 22px; }
  .chip { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.16em; font-size: 10px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid rgba(214,178,112,0.28); background: transparent; color: rgba(243,236,221,0.7); cursor: pointer; transition: all var(--dur-fast) var(--ease-quiet); }
  .chip:hover { border-color: var(--gold-line); color: #e6c785; }
  .chip.on { background: rgba(214,178,112,0.14); border-color: var(--gold-line); color: #e6c785; }

  /* grid */
  main { max-width: 1320px; margin: 0 auto; padding: 34px 40px 120px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px 26px; }
  @media (max-width: 1080px){ .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px){ .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 460px){ .grid { grid-template-columns: 1fr; } }

  .prod { cursor: pointer; }
  .prod .ph { position: relative; aspect-ratio: 4/5; border-radius: 12px; overflow: hidden; border: 1px solid rgba(214,178,112,0.22);
    background: #0c1132; box-shadow: 0 14px 36px rgba(0,0,0,0.4); }
  .prod .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--dur-slow) var(--ease-quiet); }
  .prod:hover .ph img { transform: scale(1.05); }
  .prod .ph .tag { position: absolute; top: 12px; left: 12px; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.18em; text-transform: uppercase;
    background: rgba(10,13,42,0.7); color: var(--gold-200, #e6c785); padding: 5px 10px; border-radius: 999px; backdrop-filter: blur(4px); }
  .prod .ph .add { position: absolute; bottom: 12px; left: 12px; right: 12px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
    background: rgba(10,13,42,0.78); color: #e6c785; border: 1px solid rgba(214,178,112,0.45); border-radius: 999px; padding: 11px 0; text-align: center;
    opacity: 0; transform: translateY(8px); transition: all var(--dur-base) var(--ease-quiet); backdrop-filter: blur(6px); }
  .prod:hover .ph .add { opacity: 1; transform: translateY(0); }
  .prod .info { padding: 14px 2px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .prod .nm { font-family: var(--font-serif); font-size: 18px; line-height: 1.14; letter-spacing: -0.01em; color: #f4ecdd; }
  .prod .kd { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(243,236,221,0.46); margin-top: 5px; }
  .prod .pr { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em; color: #e6c785; white-space: nowrap; }

  /* quick-view drawer */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 94vw); z-index: 80; background: #0c1132;
    border-left: 1px solid rgba(214,178,112,0.3); box-shadow: -20px 0 60px rgba(0,0,0,0.5); transform: translateX(100%);
    transition: transform var(--dur-base) var(--ease-quiet); overflow: auto; }
  .drawer.on { transform: translateX(0); }
  .drawer .dimg { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }
  .drawer .x { position: absolute; top: 16px; right: 16px; background: rgba(10,13,42,0.6); color: #fff; border: 1px solid rgba(214,178,112,0.3);
    width: 36px; height: 36px; border-radius: 999px; cursor: pointer; font-size: 15px; }
  .drawer .db { padding: 26px 30px 40px; }
  .drawer .dk { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(214,178,112,0.8); }
  .drawer h2 { font-family: var(--font-serif); font-weight: 500; font-size: 30px; line-height: 1.06; letter-spacing: -0.015em; margin: 8px 0 6px; color: #f4ecdd; }
  .drawer .dprice { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.06em; color: #e6c785; }
  .drawer .ddesc { font-family: var(--font-text); font-size: 15px; line-height: 1.65; color: rgba(243,236,221,0.72); margin: 20px 0 0; }
  .drawer .dnote { font-family: var(--font-serif); font-style: italic; font-size: 15px; color: rgba(243,236,221,0.6); margin: 16px 0 0; padding-left: 14px; border-left: 1px solid rgba(214,178,112,0.4); }
  .drawer .dadd { margin-top: 26px; width: 100%; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px;
    padding: 15px 0; border-radius: 999px; border: none; background: var(--grad-gold); color: #2a1410; cursor: pointer; transition: filter var(--dur-fast); }
  .drawer .dadd:hover { filter: brightness(1.06); }

  .scrim { position: fixed; inset: 0; z-index: 79; background: rgba(6,8,24,0.55); opacity: 0; pointer-events: none; transition: opacity var(--dur-base); }
  .scrim.on { opacity: 1; pointer-events: auto; }

  footer { max-width: 1320px; margin: 0 auto; padding: 30px 40px 70px; display: grid; grid-template-columns: repeat(3,1fr);
    border-top: 1px solid rgba(214,178,112,0.2); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.24em; font-size: 10px; color: rgba(243,236,221,0.5); }
  footer span:nth-child(2){ text-align: center; } footer span:nth-child(3){ text-align: right; }
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mecmua-theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<script defer src="../shared/dark-toggle.js"></script>
</head>
<body>
  <header>
    <a class="wm" href="../index.html">mecmûa</a>
    <span class="crumb">/ The Boutique</span>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="../index.html">Home</a>
      <a href="../library/index.html">Library</a>
      <a href="../mind/index.html">Mind</a>
      <a href="../museum/index.html">Museum</a>
      <a href="../magazine/index.html">Magazine</a>
      <a href="../wheel/index.html">Oracle</a>
      <a href="../chart/index.html">Chart</a>
      <a class="here" href="./index.html">Boutique</a>
      <a href="../atelier/index.html">Atelier</a>
    </nav>
    <button class="bag" id="bag">Bag <span class="dot" id="bagN">0</span></button>
  </header>

  <section class="hero">
    <div class="eyebrow"><span class="r"></span>The Atelier<span class="r"></span></div>
    <h1>the boutique</h1>
    <p>Wearable talismans and quiet luxuries — adornment, garments and objects, chosen in the mecmûa register of midnight and gold.</p>
  </section>

  <div class="filters" id="filters"></div>

  <main><div class="grid" id="grid"></div></main>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer"></aside>

  <footer><span>Adorn with intention</span><span>Wear what you love</span><span>Carry the sanctuary</span></footer>

  <script>
    const DIR = '../assets/imagery/';
    const P = [
      { f:'jewellery/gold-cuff-blue-stone-pleats.jpg', n:'The Lapis Cuff', cat:'Adornment', kind:'Cuff · gold & lapis', price:'£480', note:'As above, so below — worn at the wrist.', desc:'A pleated gold cuff set with a single deep-blue stone. Hand-finished; one size, gently adjustable.' },
      { f:'jewellery/pearl-drop-diamond-ring.jpg', n:'Pearl & Pavé Ring', cat:'Adornment', kind:'Ring · pearl & diamond', price:'£395', note:'The moon, set in a band.', desc:'A baroque pearl crowned with a pavé halo. A quiet statement for the right hand.' },
      { f:'jewellery/pave-diamond-fan-earring.jpg', n:'The Fan Earrings', cat:'Adornment', kind:'Earrings · pavé', price:'£520', note:'Light, caught and scattered.', desc:'Art-deco fan drops in pavé-set stones. For evenings that ask for a little brilliance.' },
      { f:'jewellery/green-heart-lariat-necklace.jpg', n:'Emerald Lariat', cat:'Adornment', kind:'Necklace · lariat', price:'£440', note:'The heart, worn openly.', desc:'A fine gold lariat falling to a green heart-cut stone. Adjustable length.' },
      { f:'jewellery/crystal-drop-rings-hand.jpg', n:'Crystal Drop Rings', cat:'Adornment', kind:'Ring set · crystal', price:'£260', note:'Small clarities for each finger.', desc:'A trio of stacking rings, each with a raw crystal drop. Sold as a set of three.' },
      { f:'jewellery/beaded-fringe-hand-cuff.jpg', n:'Beaded Hand Cuff', cat:'Adornment', kind:'Hand chain · beaded', price:'£310', note:'Adornment to the fingertips.', desc:'A beaded fringe hand-cuff that drapes from wrist to ring. Statement piece.' },
      { f:'jewellery/horse-cuff-bracelet-runway.jpg', n:'The Horse Cuff', cat:'Adornment', kind:'Bracelet · sculptural', price:'£560', note:'Myth, cast in metal.', desc:'A sculptural cuff in the form of a horse — runway-scale, for the bold.' },
      { f:'jewellery/gold-crocodile-pocket-brooch.jpg', n:'Crocodile Brooch', cat:'Adornment', kind:'Brooch · gilt', price:'£230', note:'A small guardian for the lapel.', desc:'A gilt crocodile brooch with green-stone eyes. Pins to coat, collar or bag.' },
      { f:'jewellery/antique-glass-ball-locket.jpg', n:'Glass Orb Locket', cat:'Adornment', kind:'Locket · antique glass', price:'£340', note:'Keep a little world close.', desc:'An antique-style glass orb locket on a long chain. Holds a pressed flower or a folded wish.' },
      { f:'jewellery/bottega-hummingbird-earring-ad.jpg', n:'Hummingbird Drops', cat:'Adornment', kind:'Earrings · enamel', price:'£410', note:'Stillness, mid-flight.', desc:'Enamelled hummingbird earrings, poised as if hovering. Lightweight for all-day wear.' },

      { f:'fashion/teal-velvet-runway-look.jpg', n:'Midnight Velvet Gown', cat:'Garments', kind:'Gown · silk velvet', price:'£890', note:'Velvet suede cloaked in midnight.', desc:'A floor-length silk-velvet gown in deep teal. Bias-cut, lined, made to order.' },
      { f:'fashion/embellished-teal-velvet-skirt.jpg', n:'Embellished Velvet Skirt', cat:'Garments', kind:'Skirt · embellished', price:'£520', note:'The night, hemmed in gold.', desc:'A teal velvet skirt with hand-set embellishment at the hem. Midi length.' },
      { f:'fashion/silver-lame-slip-dress.jpg', n:'Silver Lamé Slip', cat:'Garments', kind:'Dress · lamé', price:'£640', note:'Moonlight, made wearable.', desc:'A liquid silver-lamé slip dress, cut on the bias. For evenings under the stars.' },
      { f:'fashion/leaf-embroidered-sheer-bralette.jpg', n:'Leaf-Embroidered Bralette', cat:'Garments', kind:'Bralette · sheer', price:'£185', note:'The garden, embroidered.', desc:'A sheer bralette with delicate leaf embroidery. Layer beneath silk or velvet.' },
      { f:'fashion/ombre-veil-desert-figure.jpg', n:'The Ombré Veil', cat:'Garments', kind:'Veil · silk chiffon', price:'£295', note:'For the threshold between selves.', desc:'A long ombré silk-chiffon veil, dusk to deep blue. Drape, wrap or wear over the hair.' },

      { f:'fashion/blue-suede-crossbody-bag.jpg', n:'Blue Suede Crossbody', cat:'Accessories', kind:'Bag · suede', price:'£420', note:'Carry the sanctuary.', desc:'A soft blue-suede crossbody with gold hardware. Fits a notebook, a phone, a talisman.' },
      { f:'fashion/hand-holding-velvet-clutch.webp', n:'Velvet Evening Clutch', cat:'Accessories', kind:'Clutch · velvet', price:'£280', note:'Holds the essentials, beautifully.', desc:'A structured velvet clutch with a gilt clasp. For evenings and occasions.' },
      { f:'fashion/tooled-leather-hobo-bag.jpg', n:'Tooled Leather Hobo', cat:'Accessories', kind:'Bag · tooled leather', price:'£460', note:'Old-world craft, daily carry.', desc:'A generously sized hobo in hand-tooled leather. Softens beautifully with age.' },
      { f:'fashion/saint-laurent-suede-flats.jpg', n:'Suede Atelier Flats', cat:'Accessories', kind:'Shoes · suede', price:'£340', note:'Quiet steps, well shod.', desc:'Pointed suede flats in deep navy. Hand-lasted, leather-soled.' },
      { f:'fashion/chloe-charm-ballet-flat.jpg', n:'Charm Ballet Flat', cat:'Accessories', kind:'Shoes · ballet', price:'£360', note:'A charm for the journey.', desc:'A soft ballet flat with a small gold charm at the throat. Everyday elegance.' },
      { f:'fashion/striped-peep-toe-heels.jpg', n:'Striped Peep-Toe Heel', cat:'Accessories', kind:'Shoes · heel', price:'£390', note:'A measured rhythm, underfoot.', desc:'A mid-height peep-toe in striped silk. For the days that call for a little lift.' },
      { f:'fashion/blue-face-fashion-poster.jpg', n:'Atelier Print — Blue Face', cat:'Accessories', kind:'Print · giclée', price:'£95', note:'The house, framed.', desc:'A signed giclée print of the house fashion poster. A3, unframed. Limited run.' },
      { f:'jewellery/red-manicure-gold-rings.webp', n:'Stacked Gold Rings', cat:'Adornment', kind:'Ring set · gold', price:'£290', note:'Many bands, one hand.', desc:'A curated stack of fine gold rings, mixed widths. Sold as a set of five.' },
      { f:'jewellery/globe-pendant-lamp.jpg', n:'The Globe Pendant', cat:'Objects', kind:'Lamp · brass & glass', price:'£540', note:'A small sun for the room.', desc:'A spherical pendant lamp in brass and seeded glass. Casts a warm, scattered light.' },
      { f:'fashion/grey-tailored-coat.jpg', n:'The Tailored Coat', cat:'Garments', kind:'Coat · wool', price:'£720', note:'Structure for the cooler hours.', desc:'A sharply tailored wool coat in soft grey. Fully lined, made to order.' },
      { f:'fashion/floral-dress-iced-coffee.jpg', n:'Floral Day Dress', cat:'Garments', kind:'Dress · cotton', price:'£380', note:'For unhurried mornings.', desc:'A breezy floral day dress in lightweight cotton. Easy to wear, easy to love.' },
    ];
    P.forEach((p,i)=> p.id = 'MB-' + String(i+1).padStart(3,'0'));

    const cats = ['All', ...[...new Set(P.map(p=>p.cat))]];
    let cat='All', bag=0;
    const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

    const filters = document.getElementById('filters');
    filters.innerHTML = cats.map(c=>`<button class="chip ${c==='All'?'on':''}" data-c="${c}">${c}</button>`).join('');
    filters.querySelectorAll('.chip').forEach(b=> b.onclick=()=>{ cat=b.dataset.c; filters.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); render(); });

    const grid = document.getElementById('grid');
    function render(){
      const r = cat==='All' ? P : P.filter(p=>p.cat===cat);
      grid.innerHTML = r.map(p=>`
        <div class="prod" data-id="${p.id}">
          <div class="ph">
            <img src="${DIR}${p.f}" alt="${esc(p.n)}" loading="lazy" />
            <span class="tag">${p.cat}</span>
            <div class="add" data-add="${p.id}">Add to bag · ${p.price}</div>
          </div>
          <div class="info">
            <div><div class="nm">${esc(p.n)}</div><div class="kd">${esc(p.kind)}</div></div>
            <div class="pr">${p.price}</div>
          </div>
        </div>`).join('');
      grid.querySelectorAll('.prod').forEach(n=> n.addEventListener('click', ev=>{ if(ev.target.closest('[data-add]')) return; openQV(n.dataset.id); }));
      grid.querySelectorAll('[data-add]').forEach(b=> b.addEventListener('click', ev=>{ ev.stopPropagation(); addBag(); }));
    }

    function addBag(){ bag++; document.getElementById('bagN').textContent = bag; }

    const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');
    function openQV(id){
      const p = P.find(x=>x.id===id); if(!p) return;
      drawer.innerHTML = `
        <button class="x" id="qx">✕</button>
        <img class="dimg" src="${DIR}${p.f}" alt="${esc(p.n)}" />
        <div class="db">
          <div class="dk">${p.cat} · ${p.id}</div>
          <h2>${esc(p.n)}</h2>
          <div class="dprice">${p.price} · ${esc(p.kind)}</div>
          <p class="ddesc">${esc(p.desc)}</p>
          <div class="dnote">${esc(p.note)}</div>
          <button class="dadd" id="qadd">Add to bag</button>
        </div>`;
      drawer.classList.add('on'); scrim.classList.add('on');
      drawer.querySelector('#qx').onclick = closeQV;
      drawer.querySelector('#qadd').onclick = ()=>{ addBag(); closeQV(); };
    }
    function closeQV(){ drawer.classList.remove('on'); scrim.classList.remove('on'); }
    scrim.onclick = closeQV;
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeQV(); });

    render();
  </script>
</body>
</html>
