<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mejmûa — Beauty · Culture · Art · Life</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--surface-page); color: var(--text-primary); font-family: var(--font-text);
    background-image: var(--grain); background-repeat: repeat; }
  a { color: inherit; text-decoration: none; }

  /* ===== Tweaks: velvet backdrops ===== */
  body[data-bg="merlot"] { background-color: #1c0c12; background-image: var(--grain),
    linear-gradient(135deg, rgba(255,255,255,0.035), transparent 45%),
    radial-gradient(1200px 800px at 75% -10%, rgba(143,36,54,0.55), transparent 62%),
    radial-gradient(1000px 760px at 8% 112%, rgba(91,31,36,0.65), transparent 60%); }
  body[data-bg="ikb"] { background-color: #0e1136; background-image: var(--grain),
    linear-gradient(135deg, rgba(255,255,255,0.035), transparent 45%),
    radial-gradient(1200px 800px at 72% -12%, rgba(44,51,164,0.6), transparent 62%),
    radial-gradient(1000px 760px at 6% 112%, rgba(19,21,82,0.85), transparent 60%); }
  body[data-bg="mix"] { background-color: #150d1d; background-image: var(--grain),
    linear-gradient(135deg, rgba(255,255,255,0.035), transparent 45%),
    radial-gradient(1250px 820px at 18% -12%, rgba(36,42,150,0.52), transparent 60%),
    radial-gradient(1150px 800px at 88% 28%, rgba(122,30,46,0.58), transparent 58%),
    radial-gradient(900px 700px at 40% 118%, rgba(91,31,36,0.5), transparent 62%); }

  body.velvet header { background: linear-gradient(180deg, rgba(19,14,26,0.96) 0%, rgba(19,14,26,0.8) 70%, rgba(19,14,26,0) 100%); }
  body.velvet .topleft, body.velvet .topright { color: rgba(242,233,221,0.66); }
  body.velvet .topright .ic { border-color: rgba(242,233,221,0.4); color: #f2e9dd; }
  body.velvet nav button { color: rgba(242,233,221,0.62); }
  body.velvet nav button:hover, body.velvet nav button.on { color: var(--antique-gold); }
  body.velvet .section-h .t { color: #f2e9dd; }
  body.velvet .section-h .more { color: rgba(242,233,221,0.5); }
  body.velvet .story h3 { color: #f2e9dd; }
  body.velvet .story p { color: rgba(242,233,221,0.72); }
  body.velvet .story .cat { color: var(--antique-gold); }
  body.velvet .story .read { color: rgba(242,233,221,0.55); }
  body.velvet .story:hover .read { color: var(--antique-gold); }
  body.velvet .story .ph { border-color: rgba(201,160,99,0.35); }
  body.velvet .hero { box-shadow: var(--shadow-night); border: 1px solid rgba(201,160,99,0.28); }
  body.velvet footer { border-top-color: rgba(201,160,99,0.38); }
  body.velvet .foot .blurb, body.velvet .foot .col a { color: rgba(242,233,221,0.8); }
  body.velvet .foot .col h5 { color: rgba(242,233,221,0.5); }
  body.velvet .foot .col a:hover { color: var(--antique-gold); }

  /* ===== Tweaks: wordmark finish (header .wm + footer .wm2) ===== */
  body[data-fin="gold"] .wm,   body[data-fin="gold"] .wm2   { background: var(--grad-gold);   -webkit-background-clip: text; background-clip: text; color: transparent; }
  body[data-fin="chrome"] .wm, body[data-fin="chrome"] .wm2 { background: var(--grad-chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
  body[data-fin="bronze"] .wm, body[data-fin="bronze"] .wm2 { background: var(--grad-bronze); -webkit-background-clip: text; background-clip: text; color: transparent; }
  body[data-fin="matte"] .wm,  body[data-fin="matte"] .wm2  { background: none; color: #b08d5c; }

  /* ===== top bar ===== */
  header { position: sticky; top: 0; z-index: 40;
    background: linear-gradient(180deg, rgba(242,233,221,0.97) 0%, rgba(242,233,221,0.85) 70%, rgba(242,233,221,0) 100%); }
  .topline { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 30px 10px; }
  .wm { grid-column: 2; font-family: var(--font-display); text-transform: lowercase; letter-spacing: 0.02em; font-size: 46px; line-height: 1;
    color: var(--merlot); text-align: center; }
  .topright { justify-self: end; white-space: nowrap; display: flex; gap: 18px; align-items: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-secondary); }
  .topright .ic { width: 30px; height: 30px; border: var(--hairline); border-radius: 999px; display: grid; place-items: center; cursor: pointer; }
  .topleft { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); display: flex; gap: 14px; align-items: center; }
  .topleft a { color: inherit; text-decoration: none; transition: color var(--dur-fast); }
  .topleft a:hover { color: var(--antique-gold); }
  nav { display: flex; gap: 30px; justify-content: center; padding: 4px 0 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }
  nav button { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 6px 2px; position: relative; letter-spacing: 0.22em; font-family: inherit; font-size: inherit; text-transform: uppercase; transition: color var(--dur-fast); }
  nav button:hover { color: var(--merlot); }
  nav button.on { color: var(--merlot); }

  /* ===== search bar ===== */
  .searchbar { max-width: 1320px; margin: 0 auto; padding: 56px 30px 20px; display: flex; justify-content: center; }
  .searchbar .sw { position: relative; width: min(640px, 94%); }
  .searchbar input { width: 100%; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.12em; padding: 16px 24px 16px 48px;
    border: 1px solid var(--border-soft); border-radius: 999px; background: rgba(255,253,248,0.85); color: var(--ink-900); outline: none; }
  .searchbar input::placeholder { text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; color: var(--text-faint); }
  .searchbar .gl { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-faint); font-size: 16px; }
  body.velvet .searchbar input { background: rgba(242,233,221,0.07); border-color: rgba(201,160,99,0.4); color: #f2e9dd; }
  body.velvet .searchbar input::placeholder { color: rgba(242,233,221,0.45); }
  body.velvet .searchbar .gl { color: rgba(242,233,221,0.5); }

  main { max-width: 1320px; margin: 0 auto; padding: 30px 30px 0; }

  /* ===== hero ===== */
  .hero { display: grid; grid-template-columns: 1fr; min-height: 520px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-md); }
  .hero .copy { background: var(--grad-merlot); color: #f7ecd9; padding: 56px 54px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .hero .copy .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--antique-gold); margin-bottom: 22px; }
  .hero h1 { font-family: var(--font-serif); font-weight: 500; font-size: clamp(44px, 5.2vw, 76px); line-height: 0.98; letter-spacing: -0.02em; margin: 0 0 22px; }
  .hero p { font-family: var(--font-text); font-size: 19px; line-height: 1.5; max-width: 34ch; margin: 0 0 30px; color: rgba(247,236,217,0.86); }
  .hero .img { position: relative; min-height: 520px; }
  .hero .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .pag { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: rgba(247,236,217,0.7); }
  .hero .pag b { color: var(--antique-gold); }
  .btn { align-self: flex-start; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px; padding: 14px 26px; border-radius: 999px; cursor: pointer; border: 1px solid transparent; transition: all var(--dur-base) var(--ease-quiet); white-space: nowrap; }
  .btn.gold { background: var(--grad-gold); color: #2a1410; }
  .btn.gold:hover { filter: brightness(1.06); }
  .btn.outline { background: transparent; border-color: rgba(247,236,217,0.5); color: #f7ecd9; }

  /* ===== featured grid ===== */
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 56px 0 22px; }
  .section-h .t { font-family: var(--font-serif); font-size: 30px; letter-spacing: -0.01em; white-space: nowrap; }
  .section-h .more { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  @media (max-width: 1040px){ .grid { grid-template-columns: repeat(2, 1fr); } .hero { grid-template-columns: 1fr; } .hero .img { min-height: 320px; } }
  @media (max-width: 560px){ .grid { grid-template-columns: 1fr; } }
  .story { cursor: pointer; }
  .story .ph { aspect-ratio: 3/4; border-radius: var(--radius-md); overflow: hidden; border: var(--hairline); margin-bottom: 16px; position: relative; background: var(--midnight); }
  .story .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--dur-slow) var(--ease-quiet); }
  .story:hover .ph img { transform: scale(1.05); }
  .story .cat { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--merlot); margin-bottom: 8px; }
  .story h3 { font-family: var(--font-serif); font-weight: 500; font-size: 23px; line-height: 1.12; letter-spacing: -0.01em; margin: 0 0 8px; }
  .story p { font-family: var(--font-text); font-size: 15px; line-height: 1.5; color: var(--text-secondary); margin: 0 0 12px; }
  .story .read { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); display: inline-flex; gap: 8px; align-items: center; }
  .story:hover .read { color: var(--merlot); }

  /* ===== intention band ===== */
  .band { margin: 64px 0 0; border-radius: var(--radius-lg); overflow: hidden; background: var(--grad-dusk); color: #f2e9dd;
    display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; gap: 30px; padding: 52px 54px; }
  @media (max-width: 760px){ .band { grid-template-columns: 1fr; } }
  .band .big { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: clamp(30px, 4vw, 46px); line-height: 1.08; color: var(--antique-gold); }
  .band .sub { font-family: var(--font-text); font-size: 16px; line-height: 1.6; color: rgba(242,233,221,0.84); margin-top: 14px; max-width: 42ch; }
  .band .cta { display: flex; gap: 10px; margin-top: 4px; }
  .band input { flex: 1; min-width: 0; background: rgba(242,233,221,0.08); border: 1px solid rgba(242,233,221,0.28); border-radius: 999px; padding: 14px 20px; color: #f2e9dd; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; outline: none; }
  .band input::placeholder { color: rgba(242,233,221,0.5); text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; }

  /* ===== footer ===== */
  footer { margin-top: 70px; border-top: var(--hairline); }
  .foot { max-width: 1320px; margin: 0 auto; padding: 50px 30px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 30px; }
  .foot .wm2 { font-family: var(--font-display); text-transform: lowercase; font-size: 40px; color: var(--merlot); line-height: 1; }
  .foot .blurb { font-family: var(--font-text); font-size: 15px; line-height: 1.6; color: var(--text-secondary); margin-top: 12px; max-width: 34ch; }
  .foot .col h5 { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 14px; }
  .foot .col a { display: block; font-family: var(--font-text); font-size: 16px; color: var(--text-primary); padding: 5px 0; }
  .foot .col a:hover { color: var(--merlot); }
  .footbar { background: var(--ink-900); color: rgba(247,236,217,0.85); }
  body.velvet .footbar { background: transparent; }
  .footbar .inner { max-width: 1320px; margin: 0 auto; padding: 16px 30px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; flex-wrap: wrap; gap: 10px; }
  .footbar a { color: rgba(247,236,217,0.85); }
</style>

<body data-bg="ikb" data-fin="gold" class="velvet">
  <header>
    <div class="topline">
      <span class="topleft"><a href="../index.html">Home</a><a href="../library/index.html">Library</a><a href="../mind/index.html">Mind</a><a href="../museum/index.html">Museum</a><a href="../wheel/index.html">Wheel</a><a href="../boutique/index.html">Boutique</a></span>

    </div>
    <nav id="nav"></nav>

  </header>

  <main id="main"></main>

  <footer>

  </footer>

  <script>
    const DIR = '../assets/imagery/';
    const CATS = ['All','Culture','Art','Living','Travel','Beauty','Fashion'];
    const S = [
      { cat:'Culture', title:'Beauty Beyond the Surface', dek:'Stories and objects that inspire a life rich in meaning — an opening meditation for the new issue.', author:'Derya Dilara', read:'8 min', img:'woman-lantern-golden-willow.jpg', hero:true },
      { cat:'Culture', title:'Creative Minds', dek:'Interviews, essays and insights from the world\u2019s most original voices.', author:'Derya Dilara', read:'9 min', img:'starry-haired-woman-painting.jpg' },
      { cat:'Art', title:'Heirloom Pieces', dek:'Timeless treasures to wear, to collect, and to pass on.', author:'The Atelier', read:'6 min', img:'woman-gold-sun-stars-collage.jpg' },
      { cat:'Living', title:'Spaces to Dream', dek:'Homes, objects and rituals that transform the everyday.', author:'Derya Dilara', read:'7 min', img:'monet-style-willow-pond.jpg' },
      { cat:'Travel', title:'Wander Deeply', dek:'Journeys that awaken curiosity and leave a lasting impression.', author:'Field Notes', read:'11 min', img:'moonrise-white-sands-yucca.webp' },
      { cat:'Beauty', title:'The Slow Ritual', dek:'On adornment as devotion — beauty practised as a form of attention.', author:'Derya Dilara', read:'5 min', img:'crescent-moon-pink-clouds.jpg' },
      { cat:'Fashion', title:'Drape & Memory', dek:'What we wear and why it stays with us — cloth as a keeper of time.', author:'Derya Dilara', read:'7 min', img:'woman-sitting-olive-tree.jpg' },
      { cat:'Culture', title:'The Library', dek:'A digital sanctuary for depth and beauty, and the rooms that hold our reading.', author:'Derya Dilara', read:'10 min', img:'snowy-street-lantern-night.jpg' },
      { cat:'Art', title:'On Symbol', dek:'The eye, the moon, the horse — reading the old language of images.', author:'Derya Dilara', read:'6 min', img:'embroidered-eye-crescent-moon.jpg' },
      { cat:'Beauty', title:'The Painted Face', dek:'On portraiture and presence — what a face keeps and what it gives away.', author:'Derya Dilara', read:'6 min', img:'magazine-pages/artist-cover-blonde-portrait.jpg' },
      { cat:'Culture', title:'The Blue Hour', dek:'Holograms, icons and the sacred image in a screen-lit age.', author:'Derya Dilara', read:'8 min', img:'magazine-pages/blue-buddha-hologram-page.jpg' },
      { cat:'Travel', title:'Under a Vogue Sky', dek:'Notes from the road, where fashion meets the far horizon.', author:'Field Notes', read:'9 min', img:'magazine-pages/vintage-vogue-sky-cover.jpg' },
      { cat:'Fashion', title:'The Leopard Issue', dek:'Pattern as armour — on print, power and the animal we carry.', author:'The Atelier', read:'7 min', img:'magazine-pages/sagara-leopard-cover.png' },
      { cat:'Living', title:'Rooms of One’s Own', dek:'Interiors that hold a practice — light, marble, water and quiet.', author:'Derya Dilara', read:'8 min', img:'interiors-architecture/woman-armchair-art-studio.jpg' },
      { cat:'Art', title:'The Peacock & the Eye', dek:'Ornament as devotion in the old decorative traditions.', author:'Derya Dilara', read:'6 min', img:'art-illustration/peacock-ornate-artwork.jpg' },
    ];
    let cat = 'All';
    let q = '';

    const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const nav = document.getElementById('nav');
    nav.innerHTML = CATS.map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join('');
    nav.querySelectorAll('button').forEach(b=> b.onclick=()=>{ cat=b.dataset.c; nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
    document.getElementById('home').onclick = (e)=>{ e.preventDefault(); cat='All'; nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.c==='All')); render(); };

    function storyCard(s, i){
      return `<a class="story" href="article.html?id=${i}">
        <div class="ph"><img src="${DIR}${s.img}" alt=""/></div>
        <div class="cat">${s.cat}</div>
        <h3>${esc(s.title)}</h3>
        <p>${esc(s.dek)}</p>
        <span class="read">Read more →</span>
      </a>`;
    }

    document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });
    document.querySelector('.topright .ic').onclick = () => document.getElementById('q').focus();

    function render(){
      const main = document.getElementById('main');
      const pool = S.map((s,i)=>({s,i}));
      let list = cat==='All' ? pool : pool.filter(x=>x.s.cat===cat);
      if (q) list = list.filter(x => (x.s.title+' '+x.s.dek+' '+x.s.cat).toLowerCase().includes(q));
      const rest = list;
      const heroHTML = '';
      const heading = q ? 'Search' : (cat==='All' ? 'The Edit' : cat);
      main.innerHTML = heroHTML + `
        <div class="section-h"><span class="t">${heading}</span><span class="more">${list.length} stories</span></div>
        <div class="grid">${rest.map(x=>storyCard(x.s,x.i)).join('')}</div>`;
    }
    render();
  </script>
